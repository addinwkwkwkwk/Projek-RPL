<!DOCTYPE html>
<html>
<head>
    <title>Form Pendaftaran Siswa</title>
</head>
<body>

    <h2>Form Pendaftaran Siswa</h2>

    <form>
        <table>
            <!-- Nama Lengkap -->
            <tr>
                <td><label for="nama">Nama Lengkap</label></td>
                <td>:</td>
                <td><input type="text" id="nama" required placeholder="Masukkan Nama Lengkap"></td>
            </tr>

            <!-- NIK -->
            <tr>
                <td><label for="nik">NIK</label></td>
                <td>:</td>
                <td><input type="number" id="nik"></td>
            </tr>

            <!-- Email -->
            <tr>
                <td><label for="email">Email</label></td>
                <td>:</td>
                <td><input type="email" id="email"></td>
            </tr>

            <!-- Password -->
            <tr>
                <td><label for="password">Password</label></td>
                <td>:</td>
                <td><input type="password" id="password"></td>
            </tr>

            <!-- Tanggal Lahir -->
            <tr>
                <td><label for="tanggal_lahir">Tanggal Lahir</label></td>
                <td>:</td>
                <td><input type="date" id="tanggal_lahir"></td>
            </tr>

            <!-- Jenis Kelamin -->
            <tr>
                <td><label>Jenis Kelamin</label></td>
                <td>:</td>
                <td>
                    <input type="radio" name="jenisKelamin" value="Laki-laki" id="jk_l">
                    <label for="jk_l">Laki-laki</label>
                    <input type="radio" name="jenisKelamin" value="Perempuan" id="jk_p">
                    <label for="jk_p">Perempuan</label>
                </td>
            </tr>

            <!-- Hobi -->
            <tr>
                <td><label>Hobby</label></td>
                <td>:</td>
                <td>
                    <input type="checkbox" name="hobi" value="Basket"> Renang<br>
                    <input type="checkbox" name="hobi" value="Futsal"> Futsal<br>
                    <input type="checkbox" name="hobi" value="Nonton"> Game<br>
                    <input type="checkbox" name="hobi" value="Memasak"> Memasak<br>
                    <input type="checkbox" name="hobi" value="Membaca"> Menyanyi
                </td>
            </tr>

            <!-- Alamat -->
            <tr>
                <td><label for="alamat">Alamat</label></td>
                <td>:</td>
                <td>
                    <textarea id="alamat" placeholder="Masukkan Alamat lengkap"></textarea>
                </td>
            </tr>

            <!-- Jurusan -->
            <tr>
                <td><label for="jurusan">Jurusan</label></td>
                <td>:</td>
                <td>
                    <select name="jurusan" id="jurusan">
                        <option value="TKJ">TKJ</option>
                        <option value="rpl">RPL</option>
                        <option value="pg">PG</option>
                    </select>
                </td>
            </tr>

            <!-- Upload Foto -->
            <tr>
                <td><label for="foto">Upload Foto</label></td>
                <td>:</td>
                <td><input type="file" id="foto"></td>
            </tr>

            <!-- Tombol Submit -->
            <tr>
                <td></td>
                <td></td>
                <td>
                    <br>
                    <button type="submit">Kirim</button>
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
